<div style="max-width: 900px; margin: 20px auto;">
  <h2 style="color: #2c3e50; margin-bottom: 20px;">Lista de Usuarios del Sistema (Solo Admin)</h2>

  <table style="width: 100%; border-collapse: collapse; text-align: left; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <thead>
    <tr style="background-color: #34495e; color: white;">
      <th style="padding: 12px; border: 1px solid #ddd;">ID</th>
      <th style="padding: 12px; border: 1px solid #ddd;">Usuario / Email</th>
      <th style="padding: 12px; border: 1px solid #ddd;">Rol</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of usuarios">
      <td style="padding: 10px; border: 1px solid #ddd;">{{ user.id }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ user.username || user.email }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">
          <span style="background: #f39c12; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem;">
            {{ user.role || user.rol }}
          </span>
      </td>
    </tr>
    <tr *ngIf="usuarios.length === 0">
      <td colspan="3" style="text-align: center; padding: 15px; color: #7f8c8d;">No hay usuarios registrados</td>
    </tr>
    </tbody>
  </table>
</div>
